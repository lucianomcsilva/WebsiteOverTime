service: websiteovertime-geturl

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  memorySize: 128
  environment:
    IS_LOCAL: ${opt:local, 'false'}

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    usePipenv: false

package:
  patterns:
    - "!venv/**"
    - "!.pytest_cache/**"
    - "!__pycache__/**"
    - "!node_modules/**"
    - "!invoke_local.py"
    - "!.serverless/**"
    - "!build/**"
    - "sqs_geturl_lambda.py"
    - "websiteovertime-working.png"

functions:
  geturl:
    handler: sqs_geturl_lambda.lambda_handler
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:132733789290:websiteovertime-geturl.fifo
          batchSize: 10
