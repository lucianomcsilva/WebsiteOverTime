service: websiteovertime-geturl

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  memorySize: 256        # 27 S3 copies + 27 SQS sends per invocation
  timeout: 120           # default 6s was far too short → timed out and double-ran
  environment:
    IS_LOCAL: ${opt:local, 'false'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: "arn:aws:sqs:us-east-1:132733789290:websiteovertime-*.fifo"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:CopyObject
          Resource: "arn:aws:s3:::websiteovertime/*"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    usePipenv: false

package:
  patterns:
    - "!venv/**"
    - "!.pytest_cache/**"
    - "!__pycache__/**"
    - "!node_modules/**"
    - "!invoke_local.py"
    - "!.serverless/**"
    - "!build/**"
    - "sqs_geturl_lambda.py"
    - "websiteovertime-working.png"

functions:
  geturl:
    handler: sqs_geturl_lambda.lambda_handler
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:132733789290:websiteovertime-geturl.fifo
          batchSize: 1     # one domain fan-out per invocation
