service: websiteovertime-frontend

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  memorySize: 256
  timeout: 29
  environment:
    IS_LOCAL: 'false'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:GetQueueUrl
            - sqs:ReceiveMessage
            - sqs:GetQueueAttributes
          Resource: "arn:aws:sqs:us-east-1:*:websiteovertime-*.fifo"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:ListBucket
            - s3:CopyObject
          Resource:
            - "arn:aws:s3:::websiteovertime"
            - "arn:aws:s3:::websiteovertime/*"

plugins:
  - serverless-python-requirements
  - serverless-domain-manager

custom:
  pythonRequirements:
    usePipenv: false
  customDomain:
    domainName: wsot.zeetha.com
    basePath: ''
    stage: ${self:provider.stage, 'dev'}
    createRoute53Record: false
    # certificateArn: <cole aqui o ARN do certificado ACM após criá-lo>

functions:
  app:
    handler: app.handler
    events:
      - httpApi: '*'

package:
  patterns:
    - "!venv/**"
    - "!.pytest_cache/**"
    - "!__pycache__/**"
    - "!node_modules/**"
    - "!tests/**"
    - "!app_lambda.py"
